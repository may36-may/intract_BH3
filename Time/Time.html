<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>周年庆倒计时</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../picture/Kiana.jpg">
    <link rel="stylesheet" href="./Time.css">
</head>
<body>
    <h1 class="title">2026年周年庆倒计时</h1>
    <div class="container">
        <div class="container-segment">
            <div class="segment">
                <div class="flip-card" data-days-tens>
                    <div class="top">0</div>
                    <div class="bottom">0</div>
                </div>
                <div class="flip-card" data-days-ones>
                    <div class="top">1</div>
                    <div class="bottom">1</div>
                </div>
            </div>
            <div class="segment-title">Days</div>
        </div>

        <div class="container-segment">
            <div class="segment">
                <div class="flip-card" data-hours-tens>
                    <div class="top">2</div>
                    <div class="bottom">2</div>
                </div>
                <div class="flip-card" data-hours-ones>
                    <div class="top">4</div>
                    <div class="bottom">4</div>
                </div>
            </div>
            <div class="segment-title">Hours</div>
        </div>

        <div class="container-segment">
            <div class="segment">
                <div class="flip-card" data-minutes-tens>
                    <div class="top">0</div>
                    <div class="bottom">0</div>
                </div>
                <div class="flip-card" data-minutes-ones>
                    <div class="top">0</div>
                    <div class="bottom">0</div>
                </div>
            </div>
            <div class="segment-title">Minutes</div>
        </div>

        <div class="container-segment">
            <div class="segment">
                <div class="flip-card" data-seconds-tens>
                    <div class="top">0</div>
                    <div class="bottom">0</div>
                </div>
                <div class="flip-card" data-seconds-ones>
                    <div class="top">0</div>
                    <div class="bottom">0</div>
                </div>
            </div>
            <div class="segment-title">Seconds</div>
        </div>

    </div>
    <video src="../video/video.mp4" muted loop autoplay></video>
    <script src="./Time.js"></script>
</body>
</html>
