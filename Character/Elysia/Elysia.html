                <p>
“约束的惨剧”后，逐火之蛾仅存十三位融合战士，统称“十三英桀”。之于组织，他们是不可替代的重要资产，因此独立的编制有其必要意义。出于某些理由，每位成员被授予了位次和名为“刻印”的称号，以此十三“兵器”，背负文明存续的希望。爱莉希雅是与凯文齐名的十三英桀第二领袖，凡事都听凭心意而为，自由自在，与“第二位”身份格格不入的少女。无论是引起她的注意，亦或是令她失去兴趣，都值得为之如临如履。            </div>
