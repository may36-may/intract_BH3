                    琪亚娜·卡斯兰娜，编号K-423，是天命制造的律者实验体。西琳在生命的最后祈祷着重新来过，祈求自己能有一个不一样的开始。琪亚娜应着这个愿望而生，她是西琳渴求的“另一次机会”。她和空之律者是从西琳的愿望中诞生的两个灵魂，同一棵树上生长出来的两根枝条，伸向不同的方向。她们共享了西琳的感情和记忆，却走上了截然不同的路 。
