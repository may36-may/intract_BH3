    <link rel="icon" type="image/png" sizes="32x32" href="../../picture/Kiana.jpg">

<body>
    <h3>符华</h3>
    <h4>Fu Hua</h4>
    <div class="shell">
        <div class="card">
            <div class="wrapper">
                <img src="../FuHua/FuHua.jpg" alt="" class="cover-image">
            </div>
            <img src="../FuHua/FuHua.png" alt="" class="character">
        </div>
        <div class="content">
            <div class="baseform">
                <p>配音:Mace（汉语）、高山南（日语）</p><br>
                <p>性别:女</p><br>
                <p>生日:2月9日</p><br> 
            </div>
            <div class="backgroundinform">
                <p>
                符华是第一文明纪元抗崩坏组织逐火之蛾中序号CM-014的融合战士，逐火之蛾十三英桀位列第十二的“华” 。最后一战中不敌终焉律者，于安全舱中沉睡到第二文明纪元，改名赤鸢，成为神州守护者，武林公认的第一人。天穹峰事件中失去绝大部分力量，为了守护神州，和奥托达成交易，成为其麾下女武神。                </p>
            </div>
        </div>
    </div>
