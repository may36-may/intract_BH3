<body>
    <h3>丽塔·洛丝薇瑟</h3>
    <h4>Rita Rossweisse</h4>
    <div class="shell">
        <div class="card">
            <div class="wrapper">
                <img src="../Rita/Rita.jpg" alt="" class="cover-image">
            </div>
            <img src="../Rita/Rita.png" alt="" class="character">
        </div>
        <div class="content">
            <div class="baseform">
                <p>配音:小N（汉语）、悠木碧（日语）</p><br>
                <p>性别:女</p><br>
                <p>生日:3月1日</p><br> 
            </div>
            <div class="backgroundinform">
                <p>
                    丽塔·洛丝薇瑟，天命最强女武神部队“不灭之刃”的副队长，幽兰黛尔信赖的副官，兼具谋略与身手的神秘战士。她贵为组织最上级的S级女武神，但言行举止却意外地谦恭。丽塔是如此低调，以至于很多时候人们会忘了她是一位高贵的S级女武神。而她对别人的态度也并非伪装，而是一种受过良好教育的礼貌与优雅。丽塔很少提及自己的过去——准确的说，她甚至都不会谈论自己。但对她的身世感兴趣的人却不在少数，可惜在毫无死角的丽塔面前，大多数试图调查的人都只落得个无功而返的结局。
                </p>
            </div>
        </div>
    </div>
