<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading……</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../picture/Kiana.jpg">
    <link rel="stylesheet" href="../css/loading2.css">
</head>
<body>
    <div class="box">
        <div class="text" style="--i:0">
            <span style="--j:0">正</span>
            <span style="--j:1">2</span>
            <span style="--j:2">2</span>
            <span style="--j:3">8</span>
        </div>

        <div class="text" style="--i:1">
            <span style="--j:0">在</span>
            <span style="--j:1">0</span>
            <span style="--j:2">0</span>
            <span style="--j:3">4</span>
        </div>

        <div class="text" style="--i:2">
            <span style="--j:0">加</span>
            <span style="--j:1">4</span>
            <span style="--j:2">4</span>
            <span style="--j:3">0</span>
        </div>

        <div class="text" style="--i:3">
            <span style="--j:0">载</span>
            <span style="--j:1">8</span>
            <span style="--j:2">8</span>
            <span style="--j:3">2</span>
        </div>
    </div>
    <script type="text/javascript" src="../js/loading2.js"></script>
</body>
</html>
