<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/picture/Kiana.jpg">
    <!-- 这个是全世界通用的图标库，一定能用 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            color: #a0a5a8;
            background-image: linear-gradient(125deg,#e0c3fc 0%,#8ec5fc 100%);  
        }

        .shell {
            position: relative;
            width: 1000px;
            min-width: 1000px;
            min-height: 600px;
            height: 600px;
            padding: 25px;
            background-color: #ecf0f3;
            box-shadow: 10px 10px 10px 10px rgba(255, 255, 255,0.5), -10px -10px 10px 10px #f9f9f9;
            /*水平偏移（一定）、垂直偏移（一定）、模糊半径、扩散半径和颜色*/
            border-radius: 12px;
            overflow: hidden;
        }

        /*设置响应式*/
        @media (max-width:1200px) {
            .shell {
                transform: scale(0.7);
            }
        }

        @media (max-width:1000px) {
            .shell {
                transform: scale(0.6);
            }
        }

        @media (max-width:800px) {
            .shell {
                transform: scale(0.5);
            }
        }

        @media (max-width:600px) {
            .shell {
                transform: scale(0.4);
            }
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 0;
            width: 600px;
            height: 100%;
            padding: 25px;
            background-color: #ecf0f3;
            transition: 1.25s;
        }

        .form {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        .fa-brands {
            margin: 0 5px;
            border: rgba(0, 0, 0, 0.5) 2px solid;
            border-radius: 50%;
            font-size: 25px;
            padding: 3px;
            opacity: 0.5;
            transition: 0.1s;
        }

        .fa-brands:hover {
            opacity: 1;
            transition: 0.15s;
            cursor: pointer;
        }

        .form_input {
            width: 350px;
            height: 40px;
            margin: 4px 0;
            padding-left: 25px;
            font-size: 13px;
            letter-spacing: 0.15px;
            border: none;
            outline: none;
            background-color: #ecf0f3;
            transition: 0.25s ease;
            border-radius: 8px;
            box-shadow: inset 2px 2px 2px 4px #d1d9e6, inset -2px -2px 4px #f9f9f9;
            /*inset（内移）后面跟水平偏移（一定）、垂直偏移（一定）、模糊半径、扩散半径和颜色*/
        }

        .form_input:focus {
            box-shadow: inset 4px 4px 4px 4px #d1d9e6, inset -4px -4px 4px #f9f9f9;
        }

        .form_span {
            margin-top: 30px;
            margin-bottom: 20px;
        }

        .form_link {
            color: #181818;
            font-size: 15px;
            margin-top: 25px;
            border-bottom: 1px solid transparent;
            line-height: 2;
        }

        .title {
            font-size: 32px;
            font-weight: 700;
            line-height: 3;
            color: #181818;
            letter-spacing: 10px;
        }

        .description {
            font-size: 14px;
            letter-spacing: 0.25px;
            text-align: center;
            line-height: 1.6;
        }

        .button {
            width: 100px;
            height: 50px;
            border-radius: 25px;
            margin-top: 50px;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 1.15px;
            background-color: rgb(224, 196, 254,0.8);
            color: #f9f9f9;
            box-shadow: 8px 8px 16px #d1d9e6, -8px -8px 16px #f9f9f9;
            border: none;
            outline: none;
        }

        .a-container {
            z-index: 100;
            left: calc(100% - 600px);
        }

        .b-container {
            left: calc(100% - 600px);
            z-index: 0;
        }

        .switch {
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 400px;
            padding: 50px;
            z-index: 200;
            transition: 1.25s;
            background-color: #ecf0f3;
            overflow: hidden;
            box-shadow: 4px 4px 10px #d1d9e6, -4px -4px 10px #d1d9e6;
        }

        .switch_circle {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background-color: #ecf0f3;
            box-shadow: inset 8px 8px 12px #b1b8c7, inset -8px -8px 12px #fff;
            bottom: -60%;
            left: -60%;
            transition: 1.25s;
        }

        .switch_circle_t {
            top: -30%;
            left: 60%;
            width: 300px;
            height: 300px;
        }

        .switch_container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            position: absolute;
            width: 400px;
            padding: 50px 55px;
            transition: 1.25s;
        }

        .switch_button {
            cursor: pointer;
        }

        .switch_button:hover,
        .submit:hover {
            box-shadow: 6px 6px 10px #d1d9e6, -6px -6px 10px #f9f9f9;
            transform: scale(0.985);
            transition: 0.25s;
        }

        .switch_button:active,
        .switch_button:focus {
            box-shadow: 2px 2px 6px #d1d9e6, -2px -2px 6px #f9f9f9;
            transform: scale(0.97);
            transition: 0.25s;
        }

        .is-txr {
            left: calc(100% - 400px);
            transition: 1.25s;
            transform-origin: right; 
        }

        .is-txl {
            left: 0;
            transition: 1.25s;
            transform-origin: left; 
        }

        .is-z {
            z-index: 200;
            transition: 1.25s;
        }

        .is-hidden {
            visibility: hidden;
            opacity: 0;
            position: absolute;
            transition: 0.25s; /*修改之后更加丝滑了棒棒*/
        }

        .is-gx {
            animation: is-gx 1.25s;
        }

        @keyframes is-gx {

            0%,
            10%,
            100% {
                width: 400px;
            }

            30%,
            50% {
                width: 500px;
            }
        }
    </style>
</head>

<body>
    <div class="shell">
        <div class="container a-container" id="a-container">
            <form class="form" id="a-form">
                <h2 class="form_title">创建账号</h2>
                <div class="form_icon">
                    <i class="fa-brands fa-qq"></i>
                    <i class="fa-brands fa-weixin"></i>
                    <i class="fa-brands fa-bilibili"></i>
                </div>
                <span class="form_span">请选择注册方式</span>
                <input type="text" class="form_input" placeholder="Name">
                <input type="email" class="form_input" placeholder="Email">
                <input type="password" class="form_input" placeholder="password">
                <input type="password" class="form_input" placeholder="confirm password">
                <button class="form_button button submit">SING UP</button>
            </form>
        </div>

        <div class="container b-container" id="b-container">
            <form class="form" id="b-form">
                <h2 class="form_title">登入账号</h2>

                <div class="form_icon">
                    <i class="fa-brands fa-qq"></i>
                    <i class="fa-brands fa-weixin"></i>
                    <i class="fa-brands fa-bilibili"></i>
                </div>
                <span class="form_span">请选择登录方式</span>
                <input type="email" class="form_input" placeholder="Email">
                <input type="password" class="form_input" placeholder="password">
                <a href="#" class="form_link">忘记密码？</a>
                <button class="form_button button submit">SIGN IN</button>
            </form>
        </div>
        <div class="switch" id="switch-cnt">
            <div class="switch_circle"></div>
            <div class="switch_circle switch_circle_t"></div>
            <div class="switch_container" id="switch-c1">
                <h2 class="switch_title title" style="letter-spacing: 0;">Welcome Back !!!</h2>
                <p class="switch_description description">已经有账号了吗？快进去享受吧！！！</p>
                <button class="switch_button button switch_btn">SIGN IN</button>
            </div>

            <div class="switch_container is-hidden" id="switch-c2">
                <h2 class="switch_title title" style="letter-spacing: 0;">Hello Friend !!!</h2>
                <p class="switch_description description">这还不赶紧注册一万个账号！！！！</p>
                <button class="switch_button button switch_btn">SIGN UP</button>
            </div>
        </div>
    </div>
    <script>
        let switchCtn = document.querySelector("#switch-cnt");
        let switchC1 = document.querySelector("#switch-c1");
        let switchC2 = document.querySelector("#switch-c2");
        let switchCircle = document.querySelectorAll(".switch_circle");
        let switchBtn = document.querySelectorAll(".switch_btn");
        let aContainer = document.querySelector("#a-container");
        let bContainer = document.querySelector("#b-container");
        let allButtons = document.querySelectorAll(".submit");

        let getButtons = (e) => e.preventDefault()

        let changeForm = (e) => {
            switchCtn.classList.add("is-gx");
            setTimeout(function () {
                switchCtn.classList.remove("is-gx");
            }, 1500)
            switchCtn.classList.toggle("is-txr");
            switchCircle[0].classList.toggle("is-txr");
            switchCircle[1].classList.toggle("is-txr");

            switchC1.classList.toggle("is-hidden");
            switchC2.classList.toggle("is-hidden");
            aContainer.classList.toggle("is-txl");
            bContainer.classList.toggle("is-txl");
            bContainer.classList.toggle("is-z");
        }
        let shell = (e) => {
            for (var i = 0; i < allButtons.length; i++)
                allButtons[i].addEventListener("click", getButtons);
            for (var i = 0; i < switchBtn.length; i++)
                switchBtn[i].addEventListener("click", changeForm)
        }

        window.addEventListener("load", shell)

        function isValidEmail(email) {
            return /^[^\s@]+@([^\s@.,]+\.)+[^\s@.,]{2,}$/.test(email);
        }

        // 注册验证
        function validateRegisterForm() {
            const form = document.getElementById("a-form");
            const emailInput = form.querySelector("input[placeholder='Email']");
            const pwdInput = form.querySelector("input[placeholder='password']");
            const confirmInput = form.querySelector("input[placeholder='confirm password']");
            if (!emailInput || !pwdInput || !confirmInput) return false;
            const email = emailInput.value.trim();
            const pwd = pwdInput.value;
            const confirm = confirmInput.value;

            if (!isValidEmail(email)) {
                alert("邮箱格式错误！");
                return false;
            }
            if (pwd !== confirm) {
                alert("两次输入的密码不一致！");
                return false;
            }
            return true;
        }

        // 登录验证
        function validateLoginForm() {
            const form = document.getElementById("b-form");
            const emailInput = form.querySelector("input[placeholder='Email']");
            if (!emailInput) return false;
            const email = emailInput.value.trim();
            if (!isValidEmail(email)) {
                alert("邮箱格式错误！");
                return false;
            }
            // 可根据需要增加密码非空验证
            return true;
        }

        // 为提交按钮添加验证并跳转（保留原有 preventDefault 同时执行跳转）
        const registerBtn = document.querySelector("#a-form .submit");
        const loginBtn = document.querySelector("#b-form .submit");

        if (registerBtn) {
            registerBtn.addEventListener("click", function(e) {
                // 原有的 getButtons 已经执行了 e.preventDefault()，这里不会重复阻止
                if (validateRegisterForm()) {
                    window.location.href = "./main.html";
                }
            });
        }
        if (loginBtn) {
            loginBtn.addEventListener("click", function(e) {
                if (validateLoginForm()) {
                    window.location.href = "./main.html";
                }
            });
        }
    </script>
</body>

</html>
